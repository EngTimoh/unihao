<div class="container mt-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Sign Up</h2>

                    <div *ngIf="error" class="alert alert-danger">
                        {{ error }}
                    </div>

                    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="user_name" class="form-label">User Name</label>
                            <input type="text" class="form-control" id="user_name" formControlName="user_name"
                                [class.is-invalid]="signupForm.get('user_name')?.invalid && signupForm.get('user_name')?.touched">
                            <div class="invalid-feedback">
                                User Name is required.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" formControlName="location"
                                [class.is-invalid]="signupForm.get('location')?.invalid && signupForm.get('location')?.touched">
                            <div class="invalid-feedback">
                                Location is required.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone_no" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone_no" formControlName="phone_no"
                                [class.is-invalid]="signupForm.get('phone_no')?.invalid && signupForm.get('phone_no')?.touched">
                            <div class="invalid-feedback">
                                Phone Number is required.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" formControlName="gender"
                                [class.is-invalid]="signupForm.get('gender')?.invalid && signupForm.get('gender')?.touched">
                                <option value="" disabled>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="invalid-feedback">
                                Gender is required.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" formControlName="email"
                                [class.is-invalid]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
                            <div class="invalid-feedback">
                                Please provide a valid email.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" formControlName="password"
                                [class.is-invalid]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
                            <div class="invalid-feedback">
                                Password must be at least 6 characters.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                formControlName="confirmPassword"
                                [class.is-invalid]="(signupForm.get('confirmPassword')?.invalid || signupForm.hasError('mismatch')) && signupForm.get('confirmPassword')?.touched">
                            <div class="invalid-feedback">
                                Passwords must match.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" [disabled]="signupForm.invalid || loading">
                            {{ loading ? 'Signing up...' : 'Sign Up' }}
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <p>Already have an account? <a routerLink="/login">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
